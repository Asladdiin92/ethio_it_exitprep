name: EthioIT ExitPrep CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build-and-test:
    name: Flutter Analyze, Test & Verify
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ethio_it_exitprep

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze --no-fatal-infos

      - name: Run Automated Test Suite
        run: flutter test --coverage

      - name: Check Build Readiness
        run: flutter build apk --debug

  server-test:
    name: Delta-Sync Server Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ethio_it_exitprep/server
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Server Dependencies
        run: npm ci || npm install
      - name: Run Server Tests
        run: npm test
