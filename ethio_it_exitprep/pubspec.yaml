name: ethio_it_exitprep
description: "A cross‑platform offline‑first Flutter app for Ethiopian IT exit exam preparation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.0
  riverpod: ^2.5.0
  drift: ^2.15.0
  drift_dev: ^2.15.0
  sqlite3_flutter_libs: ^0.5.21
  sqlite3: ^2.4.6
  go_router: ^14.1.3
  fl_chart: ^0.65.0
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  connectivity_plus: ^6.0.3
  http: ^1.2.1
  path_provider: ^2.1.3
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.9
  freezed: ^2.4.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/
